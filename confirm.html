<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Confirmation page for the COP4813 Assignment 3 form">
    <title>Confirm Information | Imran Lufi</title>
<link rel="stylesheet" href="form.css">
</head>

<body>

    <header>
        <h1>Confirm Your Information</h1>
        <p>COP4813 - Web Systems I</p>
    </header>

    <main>
        <h2>Please Review Your Information</h2>
        <p>Make sure the information below is correct before confirming.</p>

        <div>
            <p><strong>First Name:</strong> <span id="displayFirstName"></span></p>
            <p><strong>Last Name:</strong> <span id="displayLastName"></span></p>
            <p><strong>Address:</strong> <span id="displayAddress"></span></p>
            <p><strong>City:</strong> <span id="displayCity"></span></p>
            <p><strong>State:</strong> <span id="displayState"></span></p>
            <p><strong>ZIP Code:</strong> <span id="displayZip"></span></p>
            <p><strong>Phone Number:</strong> <span id="displayPhone"></span></p>
            <p><strong>Email Address:</strong> <span id="displayEmail"></span></p>
            <p><strong>Birth Date:</strong> <span id="displayBirthdate"></span></p>
            <p><strong>Message:</strong> <span id="displayMessage"></span></p>
        </div>

        <div>
            <button type="button" id="confirmButton">Confirm</button>
            <button type="button" id="editButton">Edit Information</button>
        </div>
    </main>

    <footer>
        <p>Created by Imran Lufi</p>
    </footer>

    <script src="confirm.js"></script>

</body>

</html>
